name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Confirm tag matches Cargo package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v(.+)$') {
            throw "Releases must run from a v-prefixed version tag. Got $env:GITHUB_REF"
          }
          $tagVersion = $Matches[1]
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'branchcut' })
          if ($package.Count -ne 1) {
            throw "Expected exactly one branchcut package in Cargo metadata."
          }
          if ($tagVersion -cne $package[0].version) {
            throw "Tag version v$tagVersion does not match Cargo version $($package[0].version)."
          }
          "version=$($package[0].version)" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            extension: zip
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            extension: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            extension: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15-intel
            extension: tar.gz
            cross: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate-tag.outputs.version }}
      ARCHIVE_EXTENSION: ${{ matrix.extension }}
      CROSS_COMPILE: ${{ matrix.cross || false }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Verify release toolchain
        shell: pwsh
        run: |
          $hostLine = (rustc -vV | Select-String '^host: ').ToString()
          $hostTarget = [regex]::Match($hostLine, '^host: (.+)$').Groups[1].Value
          if ($env:CROSS_COMPILE -eq 'true') {
            if ($hostTarget -cne 'x86_64-apple-darwin' -or $env:TARGET -cne 'aarch64-apple-darwin') {
              throw "Unsupported cross-compilation pair: $hostTarget to $env:TARGET."
            }
            $sdk = (& xcrun --sdk macosx --show-sdk-path | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sdk)) {
              throw 'The Apple macOS SDK is required for Apple Silicon builds.'
            }
            "SDKROOT=$sdk" >> $env:GITHUB_ENV
          } elseif ($hostTarget -cne $env:TARGET) {
            throw "Runner Rust host $hostTarget does not match requested target $env:TARGET."
          }
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check optional regex integration formatting
        run: cargo fmt --manifest-path integrations/content-regex/Cargo.toml -- --check

      - name: Test optional regex integration
        run: cargo test --locked --manifest-path integrations/content-regex/Cargo.toml

      - name: Check optional regex integration with Clippy
        run: cargo clippy --locked --manifest-path integrations/content-regex/Cargo.toml --all-targets -- -D warnings

      - name: Check cross-target source and tests
        if: matrix.cross
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Check cross-target regex integration source and tests
        if: matrix.cross
        run: cargo clippy --locked --manifest-path integrations/content-regex/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build optional regex integration binary
        run: cargo build --release --locked --manifest-path integrations/content-regex/Cargo.toml --target-dir target --target ${{ matrix.target }}

      - name: Verify binary and prepare archive
        id: package
        shell: pwsh
        run: |
          $binaryName = if ($env:RUNNER_OS -eq 'Windows') { 'branchcut.exe' } else { 'branchcut' }
          $binary = Join-Path $env:GITHUB_WORKSPACE "target/$env:TARGET/release/$binaryName"
          $regexName = if ($env:RUNNER_OS -eq 'Windows') { 'branchcut-regex.exe' } else { 'branchcut-regex' }
          $regexBinary = Join-Path $env:GITHUB_WORKSPACE "target/$env:TARGET/release/$regexName"
          foreach ($executable in @($binary, $regexBinary)) {
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Release binary was not created: $executable"
            }
            if ($env:CROSS_COMPILE -eq 'true') {
              & lipo $executable -verify_arch arm64
              if ($LASTEXITCODE -ne 0) { throw 'Apple Silicon binary architecture verification failed.' }
              & codesign --force --sign - $executable
              if ($LASTEXITCODE -ne 0) { throw 'Apple Silicon ad-hoc signing failed.' }
              & codesign --verify --strict $executable
              if ($LASTEXITCODE -ne 0) { throw 'Apple Silicon signature verification failed.' }
              & file $executable
              if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the release binary.' }
            } else {
              $versionOutput = (& $executable --version | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $versionOutput -cne "branchcut $env:VERSION") {
                throw "Unexpected binary version output from ${executable}: $versionOutput"
              }
            }
          }

          if ($env:CROSS_COMPILE -ne 'true') {
            $fixture = Join-Path $env:RUNNER_TEMP 'branchcut-release-smoke'
            New-Item -ItemType Directory -Path $fixture -Force | Out-Null
            [IO.File]::WriteAllText((Join-Path $fixture 'example.txt'), "TODO 42`n", [Text.UTF8Encoding]::new($false))
            $literalResult = (& $binary grep --cwd $fixture --glob '*.txt' --count TODO . | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $literalResult -cne '1') {
              throw "Release literal content smoke test failed: $literalResult"
            }
            $regexResult = (& $regexBinary grep -E --cwd $fixture --glob '*.txt' --count 'TODO [0-9]+' . | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $regexResult -cne '1') {
              throw "Release regex content smoke test failed: $regexResult"
            }
            $pathResult = (& $regexBinary find -E --cwd $fixture --count '^example[.]txt$' . | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $pathResult -cne '1') {
              throw "Release regex filename smoke test failed: $pathResult"
            }
          }

          $dist = Join-Path $env:RUNNER_TEMP 'branchcut-release'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $dist $binaryName)
          Copy-Item -LiteralPath $regexBinary -Destination (Join-Path $dist $regexName)
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination $dist
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'integrations/content-regex/README.md') -Destination (Join-Path $dist 'REGEX.md')
          $dependencyJson = & cargo metadata --locked --format-version 1 --manifest-path integrations/content-regex/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Could not read optional integration dependency metadata.' }
          $dependencyMetadata = $dependencyJson | ConvertFrom-Json
          $notices = [Text.StringBuilder]::new()
          foreach ($package in ($dependencyMetadata.packages | Where-Object { $_.source } | Sort-Object name, version)) {
            [void]$notices.AppendLine("$($package.name) $($package.version)")
            [void]$notices.AppendLine("License expression: $($package.license)")
            [void]$notices.AppendLine("Source: $($package.repository)")
            $packageDirectory = Split-Path -Parent $package.manifest_path
            $licenses = @(Get-ChildItem -LiteralPath $packageDirectory -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)' } | Sort-Object Name)
            if ($licenses.Count -eq 0) { throw "No license files found for $($package.name) $($package.version)." }
            foreach ($license in $licenses) {
              [void]$notices.AppendLine("--- $($license.Name) ---")
              [void]$notices.AppendLine([IO.File]::ReadAllText($license.FullName))
            }
            [void]$notices.AppendLine()
          }
          [IO.File]::WriteAllText((Join-Path $dist 'THIRD_PARTY_LICENSES.txt'), $notices.ToString(), [Text.UTF8Encoding]::new($false))
          Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'README*.md') -File |
            Copy-Item -Destination $dist
          $archiveName = "branchcut-v$env:VERSION-$env:TARGET.$env:ARCHIVE_EXTENSION"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          if ($env:ARCHIVE_EXTENSION -eq 'zip') {
            Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $archivePath -CompressionLevel Optimal
          } else {
            $packageFiles = @(Get-ChildItem -LiteralPath $dist -File | Sort-Object Name | ForEach-Object Name)
            & tar -czf $archivePath -C $dist @packageFiles
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tarball.' }
          }
          "archive=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - validate-tag
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksum file
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'release-assets' -File | Sort-Object Name)
          if ($assets.Count -ne 4) {
            throw "Expected four platform archives, found $($assets.Count)."
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path (Get-Location) 'release-assets/SHA256SUMS'),
            [string[]]$lines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Publish assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'release-assets' -File | Sort-Object Name | ForEach-Object FullName)
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '--verify-tag',
            '--title', "Branchcut $env:GITHUB_REF_NAME",
            '--notes-file', 'RELEASE_NOTES.md'
          ) + $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
