name: Install matrix

on:
  push:
    paths:
      - ".github/workflows/install-matrix.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/install-matrix.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-query-uninstall:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          # Keep the regular gate available during ARM hosted-runner shortages.
          # Tagged releases separately validate both macOS architectures.
          - macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the tested revision using Git
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run unit and CLI regression tests
        run: cargo test --locked --no-fail-fast

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Set up Node.js for the pinned behavioral oracle
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release binary for differential checks
        run: cargo build --release --locked

      - name: Install fast-glob 3.3.3 oracle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $oracleDir = Join-Path $env:RUNNER_TEMP 'branchcut-oracle'
          npm install --prefix $oracleDir --no-save --package-lock=false --no-audit --no-fund --ignore-scripts fast-glob@3.3.3
          node scripts/verify.mjs --binary target/release/branchcut.exe --oracle-dir $oracleDir

      - name: Install fast-glob 3.3.3 oracle on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          oracle_dir="$RUNNER_TEMP/branchcut-oracle"
          npm install --prefix "$oracle_dir" --no-save --package-lock=false --no-audit --no-fund --ignore-scripts fast-glob@3.3.3
          node scripts/verify.mjs --binary target/release/branchcut --oracle-dir "$oracle_dir"

      - name: Install, query, and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'branchcut-install'
          .\scripts\install.ps1 -InstallRoot $installRoot
          $binary = Join-Path $installRoot 'bin\branchcut.exe'
          $result = & $binary --cwd . --glob 'src/main.rs' --count
          if ($LASTEXITCODE -ne 0 -or $result -ne '1') {
            throw "Installed query failed or returned an unexpected count: $result"
          }
          .\scripts\uninstall.ps1 -InstallRoot $installRoot
          if (Test-Path -LiteralPath $binary) {
            throw "Uninstaller left the binary behind: $binary"
          }

      - name: Install, query, and uninstall on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/branchcut-install"
          BRANCHCUT_INSTALL_ROOT="$install_root" sh scripts/install.sh
          binary="$install_root/bin/branchcut"
          result=$("$binary" --cwd . --glob 'src/main.rs' --count)
          if [ "$result" != '1' ]; then
            printf 'Installed query returned an unexpected count: %s\n' "$result" >&2
            exit 1
          fi
          BRANCHCUT_INSTALL_ROOT="$install_root" sh scripts/uninstall.sh
          if [ -e "$binary" ]; then
            printf 'Uninstaller left the binary behind: %s\n' "$binary" >&2
            exit 1
          fi
