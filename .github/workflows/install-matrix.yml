name: Install matrix

on:
  push:
    paths:
      - ".github/workflows/install-matrix.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/**"
      - "src/main.rs"
  pull_request:
    paths:
      - ".github/workflows/install-matrix.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/**"
      - "src/main.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-query-uninstall:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the tested revision using Git
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install, query, and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'branchcut-install'
          .\scripts\install.ps1 -InstallRoot $installRoot
          $binary = Join-Path $installRoot 'bin\branchcut.exe'
          $result = & $binary --cwd . --glob 'src/**/*.rs' --count
          if ($LASTEXITCODE -ne 0 -or $result -ne '1') {
            throw "Installed query failed or returned an unexpected count: $result"
          }
          .\scripts\uninstall.ps1 -InstallRoot $installRoot
          if (Test-Path -LiteralPath $binary) {
            throw "Uninstaller left the binary behind: $binary"
          }

      - name: Install, query, and uninstall on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/branchcut-install"
          BRANCHCUT_INSTALL_ROOT="$install_root" sh scripts/install.sh
          binary="$install_root/bin/branchcut"
          result=$("$binary" --cwd . --glob 'src/**/*.rs' --count)
          if [ "$result" != '1' ]; then
            printf 'Installed query returned an unexpected count: %s\n' "$result" >&2
            exit 1
          fi
          BRANCHCUT_INSTALL_ROOT="$install_root" sh scripts/uninstall.sh
          if [ -e "$binary" ]; then
            printf 'Uninstaller left the binary behind: %s\n' "$binary" >&2
            exit 1
          fi
